<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Source of docs/architecture-{en,zh}.png. Render at 1600x820 with ?lang=en or ?lang=zh. -->
<style>
  :root { --bg:#141414; --card:#1c1c1e; --line:#3a3a3e; --text:#f2f2f2; --dim:#a8a8ad;
          --claude:#f08a3c; --builder:#f4ead8; --review:#6fa8ff; --done:#1f6f4a; --doneline:#3ddc97; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1600px; height:820px; background:var(--bg); color:var(--text);
    font-family: Inter, "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; }
  .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, "PingFang SC", monospace; }
  h1 { position:absolute; left:0; right:0; top:70px; text-align:center; font-size:76px; font-weight:900; letter-spacing:.02em; }
  .sub { position:absolute; left:0; right:0; top:172px; text-align:center; font-size:32px; font-weight:600; color:var(--dim); }
  .row { position:absolute; left:24px; right:24px; top:286px; height:260px; display:flex; align-items:center; }
  .side { flex:none; width:150px; height:100px; border:2px solid var(--line); border-radius:14px; background:var(--card);
    display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:28px; font-weight:800; text-align:center; }
  .side.done { background:var(--done); border-color:var(--doneline); }
  .side small { font-size:16px; font-weight:500; margin-top:6px; color:#d7f5e6; }
  .arrow { flex:none; width:30px; height:3px; background:#fff; position:relative; margin:0 2px; }
  .arrow::after { content:""; position:absolute; right:-2px; top:-7px; border-left:12px solid #fff; border-top:8.5px solid transparent; border-bottom:8.5px solid transparent; }
  .step { flex:none; width:164px; height:260px; border:2px solid var(--line); border-radius:14px; background:var(--card);
    display:flex; flex-direction:column; align-items:center; padding-top:18px; text-align:center; }
  .step .n { font-size:44px; font-weight:900; line-height:1; }
  .step .t { font-size:28px; font-weight:800; margin-top:10px; white-space:nowrap; }
  .chip { margin-top:16px; min-width:118px; padding:8px 14px; border-radius:10px; font-size:20px; font-weight:800; color:#1a1a1a; }
  .chip.c { background:var(--claude); } .chip.b { background:var(--builder); } .chip.r { background:var(--review); }
  .step .d { margin-top:16px; padding:0 8px; font-size:17px; line-height:1.45; color:#d9d9de; white-space:pre-line; }
  svg { position:absolute; left:0; top:0; }
  .loop { position:absolute; left:50%; transform:translateX(-50%); top:596px; padding:8px 24px; border:3px solid var(--claude); border-radius:26px;
    background:var(--bg); color:var(--claude); font-size:24px; font-weight:800; white-space:nowrap; }
  .legend { position:absolute; left:0; right:0; top:700px; display:flex; justify-content:center; gap:40px; font-size:20px; color:var(--dim); }
  .legend span { display:inline-flex; align-items:center; gap:10px; }
  .legend i { width:18px; height:18px; border-radius:5px; display:inline-block; }
  .foot { position:absolute; left:0; right:0; top:752px; text-align:center; font-size:19px; color:#77777d; }
</style>
</head>
<body>
<h1 data-t="title"></h1>
<div class="sub" data-t="sub"></div>

<div class="row">
  <div class="side" data-t="you"></div><div class="arrow"></div>
  <div class="step" id="s1"><div class="n">1</div><div class="t" data-t="t1"></div><div class="chip c">Claude</div><div class="d mono">_tickets/open/</div></div><div class="arrow"></div>
  <div class="step"><div class="n">2</div><div class="t" data-t="t2"></div><div class="chip c">Claude</div><div class="d" data-t="d2"></div></div><div class="arrow"></div>
  <div class="step"><div class="n">3</div><div class="t" data-t="t3"></div><div class="chip b" data-t="builder"></div><div class="d" data-t="d3"></div></div><div class="arrow"></div>
  <div class="step"><div class="n">4</div><div class="t" data-t="t4"></div><div class="chip c">Claude</div><div class="d" data-t="d4"></div></div><div class="arrow"></div>
  <div class="step"><div class="n">5</div><div class="t" data-t="t5"></div><div class="chip r" data-t="reviewer"></div><div class="d" data-t="d5"></div></div><div class="arrow"></div>
  <div class="step" id="s6"><div class="n">6</div><div class="t" data-t="t6"></div><div class="chip c">Claude</div><div class="d" data-t="d6"></div></div><div class="arrow"></div>
  <div class="side done"><span data-t="done"></span><small class="mono">_tickets/done/</small></div>
</div>

<svg width="1600" height="820"><g id="loopline" fill="none" stroke="#f08a3c" stroke-width="4"></g></svg>
<div class="loop" data-t="loop"></div>

<div class="legend">
  <span><i style="background:#f08a3c"></i><b data-t="lg_c"></b></span>
  <span><i style="background:#f4ead8"></i><b data-t="lg_b"></b></span>
  <span><i style="background:#6fa8ff"></i><b data-t="lg_r"></b></span>
</div>
<div class="foot" data-t="foot"></div>

<script>
  const T = {
    zh: { title:"工单托管 · 工作原理", sub:"Claude 管理，施工模型实现，另一家的模型审查",
      you:"你说需求", t1:"写工单", t2:"派单", d2:"移入 doing/\n即加锁", t3:"施工与回执", builder:"施工模型", d3:"实现代码\n写入 _receipts/",
      t4:"验收", d4:"亲自重跑验收命令\n检查改动范围", t5:"异族审查", reviewer:"审查模型", d5:"另一家厂商\n只读 Code Review",
      t6:"逐条核实", d6:"对照代码\n判断每条审查意见", done:"完成", loop:"问题成立 → 新建修复单 → 回到 open/",
      lg_c:"Claude：只做判断", lg_b:"施工模型：便宜、按量付费", lg_r:"审查模型：换一家厂商",
      foot:"一个 skill 文件夹 · 工单和回执都是仓库里的 Markdown 文件 · 不需要服务器" },
    en: { title:"Ticket Dispatch · How it works", sub:"Claude manages, a builder model implements, another vendor's model reviews",
      you:"You ask", t1:"Ticket", t2:"Dispatch", d2:"move to doing/\n= the lock", t3:"Build", builder:"Builder", d3:"writes the code\n+ a receipt",
      t4:"Accept", d4:"reruns checks\nreads the diff", t5:"Review", reviewer:"Reviewer", d5:"different vendor\nread-only review",
      t6:"Verify", d6:"checks findings\nagainst the code", done:"Done", loop:"Real issue → fix ticket → back to open/",
      lg_c:"Claude: judgment only", lg_b:"Builder: cheap, pay per use", lg_r:"Reviewer: a different vendor",
      foot:"One skill folder · tickets and receipts are Markdown files in your repo · no server" }
  };
  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "zh";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[lang][el.dataset.t]);
  // loop arrow: from the bottom of step 6 back up into the bottom of step 1
  const a = document.getElementById("s1").getBoundingClientRect(), b = document.getElementById("s6").getBoundingClientRect();
  const x1 = a.left + a.width / 2, x6 = b.left + b.width / 2, yb = a.bottom, yl = 616, r = 18;
  document.getElementById("loopline").innerHTML =
    `<path d="M${x6} ${yb} V${yl - r} Q${x6} ${yl} ${x6 - r} ${yl} H${x1 + r} Q${x1} ${yl} ${x1} ${yl - r} V${yb + 16}"/>` +
    `<path d="M${x1 - 11} ${yb + 18} L${x1} ${yb} L${x1 + 11} ${yb + 18} Z" fill="#f08a3c" stroke="none"/>`;
</script>
</body>
</html>
