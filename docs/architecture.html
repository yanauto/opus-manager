<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Source of docs/architecture-{en,zh}.png. Render: open with ?lang=en or ?lang=zh at 1600x1000. -->
<style>
  :root { --bg:#0f1117; --panel:#161a22; --line:#2a3040; --text:#e8eaf0; --dim:#8b93a3;
          --claude:#e07a54; --builder:#d9dde6; --review:#7c9bff; --paper:#f4f1ea; --ink:#1d1f24; --green:#3ddc97; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1600px; height:1000px; background:var(--bg); color:var(--text);
    font-family: Inter, "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; }
  .abs { position:absolute; }
  .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, "PingFang SC", monospace; }
  h1 { position:absolute; left:60px; top:44px; font-size:40px; font-weight:800; letter-spacing:-0.01em; }
  .sub { position:absolute; left:60px; top:104px; font-size:22px; color:var(--dim); }
  .box { position:absolute; border-radius:22px; background:var(--panel); border:2px solid var(--line); padding:26px 28px; }
  .box h2 { font-size:28px; font-weight:800; margin-bottom:6px; }
  .box .tag { font-size:19px; color:var(--dim); }
  .you { left:60px; top:400px; width:250px; height:150px; text-align:center; padding-top:34px; }
  .mgr { left:400px; top:170px; width:420px; height:710px; border-color:var(--claude); }
  .mgr h2 { color:var(--claude); }
  .step { position:absolute; left:28px; right:24px; display:flex; gap:16px; }
  .num { flex:none; width:40px; height:40px; border-radius:50%; background:var(--claude); color:#1a0f0a; font-weight:800; font-size:21px; display:grid; place-items:center; }
  .step b { display:block; font-size:24px; margin-bottom:4px; }
  .step span { font-size:19px; color:var(--dim); line-height:1.45; }
  .mgr .foot { position:absolute; left:28px; right:28px; bottom:24px; font-size:19px; color:var(--claude); border-top:1px solid var(--line); padding-top:14px; }
  .folder { position:absolute; left:920px; width:230px; height:80px; border-radius:14px; background:var(--paper); color:var(--ink); font-size:24px; font-weight:700; display:grid; place-items:center; }
  .folder small { display:block; font-size:16px; font-weight:500; color:#6b5f4d; text-align:center; margin-top:2px; }
  .colhead { position:absolute; left:860px; top:148px; width:350px; text-align:center; font-size:19px; color:var(--dim); }
  .wk { left:1250px; width:300px; }
  .wk ul { list-style:none; margin-top:16px; }
  .wk li { font-size:21px; padding:8px 0; border-top:1px solid var(--line); }
  .wk li i { font-style:normal; color:var(--dim); font-size:18px; }
  .builders { top:170px; height:350px; border-color:#596070; }
  .reviewer { top:560px; height:290px; border-color:var(--review); }
  .reviewer h2 { color:var(--review); }
  .lbl { position:absolute; font-size:18px; color:var(--text); background:var(--bg); padding:2px 8px; border-radius:8px; white-space:nowrap; }
  .foot2 { position:absolute; left:60px; right:60px; top:922px; font-size:20px; color:var(--dim); text-align:center; }
  svg { position:absolute; left:0; top:0; }
</style>
</head>
